name: Deploy

# Deploys the Worker to Cloudflare. Credentials live in GitHub secrets, so
# nothing account-specific is ever committed to the repository.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped token, see DEPLOY.md for the exact permissions
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard -> Workers & Pages -> Account ID
#   ANTHROPIC_API_KEY      the key the sweeps bill against
#   ADMIN_TOKEN            gates starting and aborting sweeps
#
# Everything else has a working default and only needs a repository variable
# (Settings -> Variables) if you want to change it:
#   APP_HOSTNAME           default llmvisibilityicron.uk
#   ACCESS_TEAM_NAME       default icron -- becomes <name>.cloudflareaccess.com
#                          and CANNOT be renamed afterwards
#   ACCESS_EMAIL_DOMAIN    default icrontech.com -- who may open the dashboard
#   ACCESS_EMAILS          extra individual addresses, comma separated
#
# The workflow creates the Zero Trust organisation, the Access application and
# its allow policy, reads the application's AUD tag back, and bakes it into the
# Worker before deploying. The custom domain is attached by the deploy itself.
# No value is ever copied between dashboards by hand.

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply schema and prompt seed before deploying"
        type: boolean
        default: true
      sync_secrets:
        description: "Push ANTHROPIC_API_KEY and ADMIN_TOKEN to the Worker"
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Prompt seed is in sync with data/prompts.csv
        run: |
          npm run seed:gen
          if ! git diff --quiet migrations/0002_seed_prompts.sql; then
            echo "::error::migrations/0002_seed_prompts.sql is stale."
            echo "Run 'npm run seed:gen' and commit the result."
            git diff --stat migrations/0002_seed_prompts.sql
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: icron-visibility
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME || 'llmvisibilityicron.uk' }}
      ACCESS_TEAM_NAME: ${{ vars.ACCESS_TEAM_NAME || 'icron' }}
      ACCESS_EMAIL_DOMAIN: ${{ vars.ACCESS_EMAIL_DOMAIN || 'icrontech.com' }}
      ACCESS_EMAILS: ${{ vars.ACCESS_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Resolve the D1 database, creating it on first run
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          id=$(curl -sf -H "$AUTH" "${API}?name=${DB_NAME}" \
               | jq -r --arg n "$DB_NAME" '.result[]? | select(.name==$n) | .uuid' | head -1)

          if [ -z "$id" ]; then
            echo "No database named ${DB_NAME}; creating it."
            id=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
                 --data "{\"name\":\"${DB_NAME}\"}" "$API" | jq -r '.result.uuid')
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Could not resolve a D1 database id. Check the API token's D1 permission."
            exit 1
          fi
          echo "Using D1 database $id"
          echo "D1_ID=$id" >> "$GITHUB_ENV"

      - name: Ensure Zero Trust, the Access application and its policy
        run: node scripts/cf-setup.mjs

      - name: Write the resolved values into wrangler.toml
        run: |
          set -euo pipefail
          # The database id and the Access identifiers are account-specific, so
          # they are injected here rather than committed to the repository.
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${D1_ID}/" wrangler.toml
          sed -i "s|^ACCESS_TEAM_DOMAIN = .*|ACCESS_TEAM_DOMAIN = \"${RESOLVED_TEAM_DOMAIN}\"|" wrangler.toml
          sed -i "s|^ACCESS_AUD = .*|ACCESS_AUD = \"${RESOLVED_AUD}\"|" wrangler.toml

          # Attaching the custom domain here means `wrangler deploy` creates the
          # DNS record and the route, so there is nothing to click afterwards.
          printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$APP_HOSTNAME" >> wrangler.toml

          if grep -q 'ACCESS_TEAM_DOMAIN = ""' wrangler.toml || grep -q 'ACCESS_AUD = ""' wrangler.toml; then
            echo "::error::Access is not configured, so the Worker would trust any request."
            exit 1
          fi
          grep -E 'database_id|ACCESS_|pattern|custom_domain' wrangler.toml

      - name: Apply schema and prompt seed
        if: github.event_name == 'push' || inputs.apply_migrations
        run: |
          set -euo pipefail
          # Both files are idempotent: the schema is CREATE ... IF NOT EXISTS and
          # the seed upserts, so collected results are never touched.
          npx wrangler d1 execute "$DB_NAME" --remote --yes --file=./migrations/0001_init.sql
          npx wrangler d1 execute "$DB_NAME" --remote --yes --file=./migrations/0002_seed_prompts.sql

      - name: Sync Worker secrets
        if: github.event_name == 'push' || inputs.sync_secrets
        run: |
          set -euo pipefail
          for name in ANTHROPIC_API_KEY ADMIN_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is not set."
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Deploy
        run: npx wrangler deploy

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Dashboard | https://${APP_HOSTNAME} |"
            echo "| Sign-in | ${RESOLVED_TEAM_DOMAIN} |"
            echo "| D1 database | \`${D1_ID}\` |"
            echo ""
            echo "**Verify before sharing the link.** From any terminal:"
            echo ""
            echo '```'
            echo "curl -s -o /dev/null -w '%{http_code}\\n' https://${APP_HOSTNAME}/api/overview"
            echo '```'
            echo ""
            echo "That must print 401 or 302. A 200 means the data is public."
            echo ""
            echo "Then open the dashboard with \`?token=<ADMIN_TOKEN>\`, go to Runs,"
            echo "and press Start a sweep now."
          } >> "$GITHUB_STEP_SUMMARY"
